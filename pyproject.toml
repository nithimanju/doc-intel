[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-intel"
version = "0.1.0"
description = "Document intelligence: measured retrieval, agents, eval, deploy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "pypdf>=4.0",
  "pymupdf>=1.24",
  "docling>=2.143.0",
  "python-dotenv>=1.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
